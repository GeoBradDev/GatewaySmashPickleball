version: 2
updates:
  # Monthly, not weekly. The site changes a few times a year, so weekly PRs
  # would be noise nobody reads. The CI build check gates every PR for this
  # root tree.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # The toolchain moves as a unit. Ungrouped, a vite or eslint major lands
      # as separate PRs that each half-upgrade the build.
      toolchain:
        patterns:
          - "vite*"
          - "eslint*"
          - "@eslint/*"
          - "html-validate"

  # The Worker's wrangler pin, which has its own lockfile. CI does not install
  # this tree, so a green PR here proves only that nothing broke the site. Run
  # npm ci and npm run dev in worker/ before merging one.
  - package-ecosystem: npm
    directory: "/worker"
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
