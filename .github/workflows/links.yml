name: Link check

# Every outbound link on the site points at a third party that can rotate or
# expire: the Global Pickleball Network registration, the Notion FAQ, and the
# WhatsApp group invite. WhatsApp invites in particular can be revoked or
# regenerated at any time, and the first person to notice should not be a
# prospective player trying to join.
#
# Deliberately separate from ci.yml. These hosts can rate-limit or block a
# runner IP, and a pull request that goes red for that reason teaches people
# to ignore red. Here a failure is a notification instead.
on:
  schedule:
    # Mondays at 14:00 UTC, which is a weekday morning in St. Louis, so a
    # broken registration link is found before the week's sign-ups.
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Outbound links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # check-links itself uses only built-in Node APIs, but it now scans
      # dist/, so the build has to run first and that needs dependencies.
      - run: npm ci

      - run: npm run check-links
